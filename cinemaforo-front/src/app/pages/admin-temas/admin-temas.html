<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h2 class="m-0">Moderar temas</h2>
    <select
      class="form-select form-control w-auto"
      (change)="cambiarFiltro($any($event.target).value)"
    >
      <option value="TODOS">Todos</option>
      <option value="ACTIVO">Activos</option>
      <option value="BANEADO">Baneados</option>
    </select>
  </div>

  @if (error()) {
    <div class="cf-error mb-3">{{ error() }}</div>
  }

  <div class="cf-panel table-responsive">
    <table class="table table-dark align-middle m-0">
      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Autor</th>
          <th>Estado</th>
          <th class="text-end">Acción</th>
        </tr>
      </thead>
      <tbody>
        @for (t of visibles(); track t.idTema) {
          <tr>
            <td>{{ t.idTema }}</td>
            <td>{{ t.titulo }}</td>
            <td>{{ autor(t.idUsuario) }}</td>
            <td>
              <span class="cf-chip">{{ t.estado }}</span>
            </td>
            <td class="text-end">
              @if (t.estado === 'ACTIVO') {
                <button type="button" class="cf-btn cf-btn-sm cf-btn-peligro" (click)="banear(t)">
                  Banear
                </button>
              } @else {
                <button type="button" class="cf-btn cf-btn-sm" (click)="reactivar(t)">
                  Reactivar
                </button>
              }
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="text-center text-secondary py-4">No hay temas para mostrar.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
